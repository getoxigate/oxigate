[package]
name    = "xtask"
version = "0.1.0"
edition = "2024"
publish = false          # never published to crates.io

[dependencies]
anyhow = "1"             # acceptable: xtask is a binary tool, not library code
# The provider usage scan parses Rust source. Both already resolve in this workspace's lockfile
# through the library's own proc-macro dependencies; `span-locations` lets a finding name its line.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
