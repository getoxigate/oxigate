name: Release

# Builds the gateway image and publishes it to Docker Hub as
# oxigate/oxigate:<version> and oxigate/oxigate:latest.
#
# Trigger it either by pushing a v* tag (v0.2.0 -> 0.2.0), or by hand from the
# Actions tab when you need to re-publish without moving a tag.
#
# Requires two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.2.0)"
        required: true

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The tag names the release, but the binary reports the Cargo.toml version.
      # If those disagree the image is mislabelled and bug reports land against
      # the wrong version, so a mismatch fails the release instead of shipping.
      - name: Resolve and verify version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"

          if [ "$version" != "$crate_version" ]; then
            echo "::error::release version '${version}' does not match Cargo.toml version '${crate_version}' — bump Cargo.toml and retag"
            exit 1
          fi

          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "Publishing oxigate/oxigate:${version}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            oxigate/oxigate:${{ steps.version.outputs.value }}
            oxigate/oxigate:latest
          # The Dockerfile's cache mounts live inside the builder, so they vanish
          # between runners. This persists them in the Actions cache instead.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Skip attestation manifests; they show up as bogus "unknown/unknown"
          # architecture rows on the Docker Hub tag page.
          provenance: false
